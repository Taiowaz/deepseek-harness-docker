name: deepseek-harness

services:
  harness:
    build:
      context: .
      network: host
      args:
        DSH_VERSION: 0.1.2-rc.1
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    restart: unless-stopped
    init: true
    working_dir: /workspace
    environment:
      DSH_HOME: /data
      HOME: /data/home
      NPM_CONFIG_CACHE: /data/cache/npm
      TZ: Asia/Shanghai
    command:
      - web
      - --port
      - "3080"
      - --trusted-host
      - "${LAN_IP:-10.61.16.33}"
    volumes:
      - ./data:/data
      - ./workspace:/workspace
    ports:
      - "${LAN_IP:-10.61.16.33}:443:8443"
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3080/').then(r=>process.exit(r.status === 200 || r.status === 401 ? 0 : 1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    network_mode: service:harness
    depends_on:
      harness:
        condition: service_healthy
    environment:
      LAN_IP: "${LAN_IP:-10.61.16.33}"
      BASIC_AUTH_HASH: "${BASIC_AUTH_HASH:?Set BASIC_AUTH_HASH in .env first}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
